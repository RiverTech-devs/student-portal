<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⌨️ GRIDFALL — Terminal Quest</title>
<style>
:root{
  --bg:#090c12; --term:#0d1119; --border:#1f2a3d; --text:#c9d6e8; --dim:#66788f;
  --green:#5fd68a; --red:#ff6b6b; --yellow:#ffd36a; --cyan:#5ac8e0; --mag:#c792ea;
  --accent:#5ac8e0; --card:#131a26;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Cascadia Code','Consolas','Courier New',monospace;display:flex;flex-direction:column}
#statusbar{display:flex;gap:14px;align-items:center;padding:7px 14px;background:var(--card);border-bottom:1px solid var(--border);font-size:.78rem;flex-wrap:wrap}

#statusbar .xpbar i{display:block;height:100%;background:var(--cyan)}
#term{flex:1;overflow-y:auto;padding:12px 14px;font-size:.86rem;line-height:1.42;white-space:pre-wrap;word-break:break-word}
#inputrow{display:flex;padding:6px 14px 12px;gap:8px;align-items:center;background:var(--bg)}
#prompt{color:var(--green);white-space:nowrap;font-size:.86rem}
#cmd{flex:1;background:transparent;border:none;outline:none;color:var(--text);font:inherit;font-size:.86rem;caret-color:var(--green)}
.t-sys{color:var(--dim)} .t-ok{color:var(--green)} .t-err{color:var(--red)} .t-warn{color:var(--yellow)}
.t-info{color:var(--cyan)} .t-npc{color:var(--mag)} .t-echo{color:#8fa3bd}
.t-title{color:var(--yellow);font-weight:700}
a.t-link{color:var(--cyan)}
#editor-bg{position:fixed;inset:0;background:rgba(4,7,12,.9);display:none;z-index:40;padding:14px}
#editor-bg.open{display:flex;flex-direction:column;gap:8px}
#editor-head{display:flex;gap:10px;align-items:center;color:var(--dim);font-size:.8rem;flex-wrap:wrap}
#editor-head .fn{color:var(--yellow)}
#editor-main{flex:1;display:flex;gap:10px;min-height:0}
#editor{flex:1;background:var(--term);border:1px solid var(--border);border-radius:8px;color:var(--text);font:inherit;font-size:.86rem;padding:12px;resize:none;outline:none;tab-size:2}
#preview-pane{flex:1;background:#fff;border:1px solid var(--border);border-radius:8px;display:none}
#preview-pane.open{display:block}
#preview-pane iframe{width:100%;height:100%;border:none;border-radius:8px}
#editor-out{max-height:26vh;overflow-y:auto;background:var(--term);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:.8rem;white-space:pre-wrap}
#editor-btns{display:flex;gap:8px}
button.ebtn{background:var(--card);border:1px solid var(--border);color:var(--text);font:inherit;font-size:.8rem;padding:7px 16px;border-radius:7px;cursor:pointer}
button.ebtn.primary{background:var(--cyan);color:#04121a;font-weight:700;border-color:var(--cyan)}
@media (max-width:720px){ #editor-main{flex-direction:column} }
</style>
</head>
<body>
<div id="statusbar">
  <span class="logo">▓ GRIDFALL</span>
  <span class="item">rank <b id="sb-rank">—</b></span>
  <span class="item">lvl <b id="sb-lvl">1</b></span>
  <span class="xpbar"><i id="sb-xp" style="width:0%"></i></span>
  <span class="item">zone <b id="sb-zone">boot-sector</b></span>
  <span class="item">quests <b id="sb-q">0</b></span>
  <span class="item" id="sb-save"></span>
</div>
<div id="term" onclick="if(!getSelection().toString())document.getElementById('cmd').focus()"></div>
<div id="inputrow"><span id="prompt">operative@grid:~$</span><input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false"></div>

<div id="editor-bg">
  <div id="editor-head"><span class="fn" id="editor-title">editor</span><span id="editor-task"></span></div>
  <div id="editor-main">
    <textarea id="editor" spellcheck="false"></textarea>
    <div id="preview-pane"><iframe id="preview" sandbox="allow-same-origin"></iframe></div>
  </div>
  <div id="editor-out"></div>
  <div id="editor-btns">
    <button class="ebtn primary" onclick="TQ.editorSubmit()">✔ Submit (grade it)</button>
    <button class="ebtn" onclick="TQ.editorRun()">▶ Run / Preview</button>
    <button class="ebtn" onclick="TQ.editorClose()">✕ Close (progress kept)</button>
  </div>
</div>

<script src="../shared/tech-data.js"></script>
<script>
'use strict';
/* ============================================================
   GRIDFALL — Terminal Quest engine
   The Grid crashed. Zones are dark. You are a Junior Systems
   Operative: bring them back online by proving real skills —
   real commands, real code, graded by real execution.
   ============================================================ */

// ---------- quest content registry (content blocks spliced below) ----------
const QUESTS = {};   // nodeId -> quest spec
// ---------- codex lesson registry (lesson blocks spliced below) ----------
// LESSONS[nodeId] = { topic:'Loops', pages:[{title, body:[lines], example:[code lines]}] }
const LESSONS = {};

const TQ = (() => {

const TD = window.TECH_DATA || { nodes:{}, skillToId:{} };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// ============ terminal ============
const term = $('term'), cmdIn = $('cmd');
function print(text, cls){
  const d = document.createElement('div');
  if (cls) d.className = 't-' + cls;
  d.innerHTML = esc(text) === '' ? ' ' : esc(text);
  term.appendChild(d);
  term.scrollTop = term.scrollHeight;
}
function printLines(lines, cls){ (lines||[]).forEach(l => print(l, cls)); }
function printBlock(lines){ print(''); printLines(lines, null); print(''); }

// ============ virtual filesystem ============
function dir(children){ return { type:'dir', children: children || {} }; }
function file(contents){ return { type:'file', contents: String(contents == null ? '' : contents) }; }
const FS = { root: dir({ home: dir({ operative: dir({}) }), grid: dir({}), tmp: dir({}) }) };
let CWD = '/home/operative';

function normPath(p){
  if (!p) return CWD;
  if (p === '~') p = '/home/operative';
  else if (p.startsWith('~/')) p = '/home/operative/' + p.slice(2);
  if (!p.startsWith('/')) p = CWD + '/' + p;
  const parts = [];
  for (const seg of p.split('/')){
    if (!seg || seg === '.') continue;
    if (seg === '..') parts.pop(); else parts.push(seg);
  }
  return '/' + parts.join('/');
}
function nodeAt(p){
  p = normPath(p);
  if (p === '/') return FS.root;
  let cur = FS.root;
  for (const seg of p.slice(1).split('/')){
    if (!cur || cur.type !== 'dir' || !cur.children[seg]) return null;
    cur = cur.children[seg];
  }
  return cur;
}
function parentOf(p){
  p = normPath(p);
  const i = p.lastIndexOf('/');
  return { parent: nodeAt(p.slice(0, i) || '/'), name: p.slice(i + 1) };
}
function mkdirp(p){
  p = normPath(p);
  let cur = FS.root;
  for (const seg of p.slice(1).split('/')){
    if (!seg) continue;
    if (!cur.children[seg]) cur.children[seg] = dir();
    cur = cur.children[seg];
    if (cur.type !== 'dir') return null;
  }
  return cur;
}
function writeFileAt(p, contents){
  const { parent, name } = parentOf(p);
  if (!parent || parent.type !== 'dir' || !name) return false;
  parent.children[name] = file(contents);
  return true;
}

// ============ shell ============
let lastOutput = '';          // combined stdout of the last executed pipeline
let lastCmds = [];            // command names used in the last line
let lastPiped = false;
const history = [];
let histIx = -1;

function tokenize(s){
  const out = []; let cur = '', q = null;
  for (let i = 0; i < s.length; i++){
    const c = s[i];
    if (q){ if (c === q) q = null; else cur += c; }
    else if (c === '"' || c === "'") q = c;
    else if (/\s/.test(c)){ if (cur){ out.push(cur); cur=''; } }
    else cur += c;
  }
  if (cur) out.push(cur);
  return out;
}
function splitPipes(s){
  const segs = []; let cur = '', q = null;
  for (let i = 0; i < s.length; i++){
    const c = s[i];
    if (q){ cur += c; if (c === q) q = null; }
    else if (c === '"' || c === "'"){ q = c; cur += c; }
    else if (c === '|'){ segs.push(cur); cur = ''; }
    else cur += c;
  }
  segs.push(cur);
  return segs;
}

const BIN = {};  // name -> {fn(args, stdin) -> {out, err}, man}
function reg(name, man, fn){ BIN[name] = { fn, man }; }

reg('help', 'help — list commands', () => ({ out:
`GRID SHELL — commands
  files:  ls  cd  pwd  cat  mkdir  touch  rm  cp  mv  echo
  text:   grep  find  head  tail  wc  sort  uniq   (pipes | and > >> work)
  game:   look  map  go <zone>  talk <name>  quest  quest start <n>  hint
          answer <text>  code  done  stats  badges  save  skills
  codex:  learn (study the current quest topic)  learn list  next  back
  other:  man <cmd>  history  clear  whoami  date
Type "quest" to see available missions. "man <cmd>" explains any command.` }));
reg('man', 'man <cmd> — manual', a => {
  const b = BIN[a[0]];
  return b ? { out: b.man } : { err: 'man: no entry for ' + (a[0]||'(nothing)') };
});
reg('pwd', 'pwd — print working directory', () => ({ out: CWD }));
reg('whoami', 'whoami — who are you?', () => ({ out: 'operative' }));
reg('date', 'date — current date/time', () => ({ out: new Date().toString() }));
reg('clear', 'clear — clear the screen', () => { term.innerHTML = ''; return { out: '' }; });
reg('history', 'history — recent commands', () => ({ out: history.slice(-20).join('\n') }));
reg('echo', 'echo <text> — print text', a => ({ out: a.join(' ') }));
reg('ls', 'ls [path] — list directory contents', a => {
  const n = nodeAt(a[0] || CWD);
  if (!n) return { err: 'ls: no such path: ' + a[0] };
  if (n.type === 'file') return { out: normPath(a[0]) };
  const names = Object.keys(n.children).sort();
  return { out: names.map(k => n.children[k].type === 'dir' ? k + '/' : k).join('\n') };
});
reg('cd', 'cd <path> — change directory', a => {
  const t = normPath(a[0] || '~');
  const n = nodeAt(t);
  if (!n) return { err: 'cd: no such directory: ' + (a[0]||'~') };
  if (n.type !== 'dir') return { err: 'cd: not a directory: ' + a[0] };
  CWD = t; updatePrompt();
  onEnterDir(t);
  return { out: '' };
});
reg('cat', 'cat <file> — print file contents', (a, stdin) => {
  if (!a.length) return { out: stdin || '' };
  const outs = [];
  for (const p of a){
    const n = nodeAt(p);
    if (!n) return { err: 'cat: no such file: ' + p };
    if (n.type === 'dir') return { err: 'cat: is a directory: ' + p };
    outs.push(n.contents);
  }
  return { out: outs.join('\n') };
});
reg('mkdir', 'mkdir <dir> — create a directory', a => {
  if (!a[0]) return { err: 'mkdir: missing name' };
  for (const p of a){
    const { parent, name } = parentOf(p);
    if (!parent || parent.type !== 'dir') return { err: 'mkdir: bad path: ' + p };
    if (parent.children[name]) return { err: 'mkdir: already exists: ' + p };
    parent.children[name] = dir();
  }
  return { out: '' };
});
reg('touch', 'touch <file> — create an empty file', a => {
  if (!a[0]) return { err: 'touch: missing name' };
  for (const p of a){
    const { parent, name } = parentOf(p);
    if (!parent || parent.type !== 'dir') return { err: 'touch: bad path: ' + p };
    if (!parent.children[name]) parent.children[name] = file('');
  }
  return { out: '' };
});
reg('rm', 'rm [-r] <path> — remove a file (or directory with -r)', a => {
  const rec = a[0] === '-r'; const paths = rec ? a.slice(1) : a;
  if (!paths[0]) return { err: 'rm: missing path' };
  for (const p of paths){
    const { parent, name } = parentOf(p);
    const n = parent && parent.children[name];
    if (!n) return { err: 'rm: no such path: ' + p };
    if (n.type === 'dir' && !rec) return { err: 'rm: is a directory (use rm -r): ' + p };
    delete parent.children[name];
  }
  return { out: '' };
});
reg('cp', 'cp <src> <dest> — copy a file', a => {
  const [s, d] = a;
  if (!s || !d) return { err: 'cp: need source and destination' };
  const n = nodeAt(s);
  if (!n || n.type !== 'file') return { err: 'cp: no such file: ' + s };
  let target = d;
  const dn = nodeAt(d);
  if (dn && dn.type === 'dir') target = normPath(d) + '/' + s.split('/').pop();
  return writeFileAt(target, n.contents) ? { out: '' } : { err: 'cp: bad destination: ' + d };
});
reg('mv', 'mv <src> <dest> — move/rename', a => {
  const [s, d] = a;
  if (!s || !d) return { err: 'mv: need source and destination' };
  const { parent, name } = parentOf(s);
  const n = parent && parent.children[name];
  if (!n) return { err: 'mv: no such path: ' + s };
  let target = d;
  const dn = nodeAt(d);
  if (dn && dn.type === 'dir') target = normPath(d) + '/' + name;
  const t = parentOf(target);
  if (!t.parent || t.parent.type !== 'dir' || !t.name) return { err: 'mv: bad destination: ' + d };
  t.parent.children[t.name] = n;
  delete parent.children[name];
  return { out: '' };
});
reg('grep', 'grep [-i] <pattern> [file] — print matching lines (works with pipes)', (a, stdin) => {
  let ci = false;
  if (a[0] === '-i'){ ci = true; a = a.slice(1); }
  const pat = a[0];
  if (!pat) return { err: 'grep: missing pattern' };
  let text = stdin;
  if (a[1]){
    const n = nodeAt(a[1]);
    if (!n || n.type !== 'file') return { err: 'grep: no such file: ' + a[1] };
    text = n.contents;
  }
  if (text == null) return { err: 'grep: no input (give a file or pipe into me)' };
  let re;
  try { re = new RegExp(pat, ci ? 'i' : ''); } catch(e){ return { err: 'grep: bad pattern' }; }
  return { out: text.split('\n').filter(l => re.test(l)).join('\n') };
});
reg('find', 'find <name> [path] — find files whose name contains <name>', a => {
  const q = a[0];
  if (!q) return { err: 'find: missing name' };
  const start = normPath(a[1] || CWD);
  const hits = [];
  (function walk(p, n){
    if (n.type === 'dir') for (const k of Object.keys(n.children)){
      const cp = (p === '/' ? '' : p) + '/' + k;
      if (k.includes(q)) hits.push(cp + (n.children[k].type === 'dir' ? '/' : ''));
      walk(cp, n.children[k]);
    }
  })(start, nodeAt(start) || dir());
  return { out: hits.join('\n') };
});
reg('head', 'head [-n N] <file> — first N lines (default 10)', (a, stdin) => nTool(a, stdin, true));
reg('tail', 'tail [-n N] <file> — last N lines (default 10)', (a, stdin) => nTool(a, stdin, false));
function nTool(a, stdin, head){
  let n = 10;
  if (a[0] === '-n'){ n = parseInt(a[1], 10) || 10; a = a.slice(2); }
  let text = stdin;
  if (a[0]){
    const f = nodeAt(a[0]);
    if (!f || f.type !== 'file') return { err: 'no such file: ' + a[0] };
    text = f.contents;
  }
  if (text == null) return { err: 'no input' };
  const lines = text.split('\n');
  return { out: (head ? lines.slice(0, n) : lines.slice(-n)).join('\n') };
}
reg('wc', 'wc [-l|-w] <file> — count lines/words/chars', (a, stdin) => {
  let mode = null;
  if (a[0] === '-l' || a[0] === '-w'){ mode = a[0]; a = a.slice(1); }
  let text = stdin;
  if (a[0]){
    const f = nodeAt(a[0]);
    if (!f || f.type !== 'file') return { err: 'wc: no such file: ' + a[0] };
    text = f.contents;
  }
  if (text == null) return { err: 'wc: no input' };
  const l = text ? text.split('\n').length : 0;
  const w = text.trim() ? text.trim().split(/\s+/).length : 0;
  if (mode === '-l') return { out: String(l) };
  if (mode === '-w') return { out: String(w) };
  return { out: `${l} ${w} ${text.length}` };
});
reg('sort', 'sort [file] — sort lines', (a, stdin) => {
  let text = stdin;
  if (a[0]){ const f = nodeAt(a[0]); if (!f || f.type !== 'file') return { err: 'sort: no such file' }; text = f.contents; }
  if (text == null) return { err: 'sort: no input' };
  return { out: text.split('\n').sort().join('\n') };
});
reg('uniq', 'uniq [file] — drop adjacent duplicate lines (sort first!)', (a, stdin) => {
  let text = stdin;
  if (a[0]){ const f = nodeAt(a[0]); if (!f || f.type !== 'file') return { err: 'uniq: no such file' }; text = f.contents; }
  if (text == null) return { err: 'uniq: no input' };
  const out = []; let prev = null;
  for (const l of text.split('\n')){ if (l !== prev) out.push(l); prev = l; }
  return { out: out.join('\n') };
});

function execLine(line){
  // redirect?
  let redirect = null, append = false;
  const rm = line.match(/(.*?)(>>?)\s*(\S+)\s*$/);
  let body = line;
  if (rm && !/['"].*>.*['"]/.test(line)){ body = rm[1]; append = rm[2] === '>>'; redirect = rm[3]; }
  const segs = splitPipes(body).map(s => s.trim()).filter(Boolean);
  if (!segs.length) return;
  lastCmds = []; lastPiped = segs.length > 1;
  let stdin = null, out = '', errored = false;
  for (const seg of segs){
    const toks = tokenize(seg);
    const name = toks[0];
    lastCmds.push(name);
    const bin = BIN[name] || GAME[name];
    if (!bin){ print(`${name}: command not found (try "help")`, 'err'); errored = true; break; }
    const r = bin.fn(toks.slice(1), stdin) || { out: '' };
    if (r.err){ print(r.err, 'err'); errored = true; break; }
    stdin = r.out; out = r.out;
  }
  if (errored){ lastOutput = ''; return; }
  lastOutput = out || '';
  if (redirect){
    const p = normPath(redirect);
    const existing = nodeAt(p);
    const prevContents = (append && existing && existing.type === 'file') ? existing.contents + '\n' : '';
    if (!writeFileAt(p, prevContents + (out || ''))) print('cannot write: ' + redirect, 'err');
  } else if (out) print(out);
}

// ============ RPG layer ============
const RANKS = ['Boot Apprentice','Byte Runner','Script Cadet','Loop Wrangler','Stack Agent','Kernel Knight','Protocol Ranger','Cipher Warden','Systems Architect','Grid Master'];
const Player = { xp: 0, level: 1, badges: [], hints: 0 };
const QState = {};   // nodeId -> {done, step, hints, solutions:{}}
let activeQuest = null;   // nodeId
let saveDirty = false;

const ZONE_FLAVOR = {
  'boot-sector':   { name:'Boot Sector',   desc:'Where every operative wakes up. Flickering BIOS light. Learn to move.' },
  'the-archives':  { name:'The Archives',  desc:'Endless shelves of scattered files. The librarians went offline mid-sort.' },
  'logic-forge':   { name:'Logic Forge',   desc:'Molten algorithms cool into functions here. The anvils still glow.' },
  'web-harbor':    { name:'Web Harbor',    desc:'Half-rendered pages drift like ghost ships. Markup masts, style sails.' },
  'data-vaults':   { name:'Data Vaults',   desc:'Rows and columns behind vault doors. The query lanterns have dimmed.' },
  'mech-bay':      { name:'Mech Bay',      desc:'Dormant robots hang in service cradles, waiting for code.' },
  'kernel-depths': { name:'Kernel Depths', desc:'The deep systems. Few operatives go this far down.' },
  'signal-tower':  { name:'Signal Tower',  desc:'Networks, packets and protocols. The tower still hums faintly.' }
};
function zoneOf(nodeId){ return (QUESTS[nodeId] && QUESTS[nodeId].zone) || 'boot-sector'; }
let currentZone = 'boot-sector';

function levelFor(xp){ return Math.max(1, Math.floor(Math.sqrt(xp / 60)) + 1); }
function xpForLevel(l){ return 60 * (l - 1) * (l - 1); }
function grantXP(n){
  Player.xp += n;
  const nl = levelFor(Player.xp);
  print(`+${n} XP`, 'ok');
  if (nl > Player.level){
    Player.level = nl;
    const rank = RANKS[Math.min(RANKS.length - 1, nl - 1)];
    printBlock([`▲ LEVEL UP — you are now level ${nl}: ${rank}`]);
  }
  updateStatus();
}
function updateStatus(){
  $('sb-lvl').textContent = Player.level;
  $('sb-rank').textContent = RANKS[Math.min(RANKS.length - 1, Player.level - 1)];
  const lo = xpForLevel(Player.level), hi = xpForLevel(Player.level + 1);
  $('sb-xp').style.width = Math.min(100, Math.round((Player.xp - lo) / (hi - lo) * 100)) + '%';
  $('sb-q').textContent = Object.values(QState).filter(q => q.done).length + '/' + Object.keys(QUESTS).length;
  $('sb-zone').textContent = currentZone;
}
function updatePrompt(){ $('prompt').textContent = `operative@grid:${CWD.replace('/home/operative','~')}$`; }

function questAvailable(id){
  const node = TD.nodes[id];
  if (!node) return true;
  return (node.hard_prereqs || []).every(p => {
    const pn = TD.nodes[p];
    if (!pn || !pn.assess || pn.assess.type !== 'quest' || !QUESTS[p]) return true; // project/teacher-verified prereqs never block the game
    return QState[p] && QState[p].done;
  });
}
function questList(){
  const ids = Object.keys(QUESTS);
  const azone = {};
  for (const id of ids){
    const z = zoneOf(id);
    (azone[z] = azone[z] || []).push(id);
  }
  print('');
  print('MISSION LOG — quest start <number> to begin', 'title');
  let n = 0; const index = [];
  for (const z of Object.keys(azone)){
    const zf = ZONE_FLAVOR[z] || { name: z };
    print(`  ── ${zf.name} ──`, 'info');
    for (const id of azone[z]){
      n++; index.push(id);
      const st = QState[id];
      const node = TD.nodes[id];
      const mark = st && st.done ? '✔' : (st && st.step > 0 ? '◐' : (questAvailable(id) ? '·' : '🔒'));

// ---------- step checking (shell steps auto-check after each command) ----------
function checkStep(verbose){
  if (!activeQuest) return;
  const q = QUESTS[activeQuest], st = QState[activeQuest];
  const step = q.steps[st.step];
  if (!step || step.type !== 'shell') { if (verbose) print('Current step is graded from the editor or "answer".', 'sys'); return; }
  const c = step.check || {};
  let pass = true; const misses = [];
  for (const f of (c.fs || [])){
    const n = nodeAt(f.path);
    if (f.exists === false){ if (n){ pass = false; misses.push(f.path + ' should not exist'); } continue; }
    if (!n){ pass = false; misses.push(f.path + ' missing'); continue; }
    if (f.isDir && n.type !== 'dir'){ pass = false; misses.push(f.path + ' should be a directory'); }
    if (f.isFile && n.type !== 'file'){ pass = false; misses.push(f.path + ' should be a file'); }
    if (f.contains != null && (n.type !== 'file' || !n.contents.includes(f.contains))){ pass = false; misses.push(f.path + ' should contain "' + f.contains + '"'); }
    if (f.equals != null && (n.type !== 'file' || n.contents.trim() !== String(f.equals).trim())){ pass = false; misses.push(f.path + ' contents not right yet'); }
    if (f.lines != null && (n.type !== 'file' || n.contents.split('\n').filter(Boolean).length !== f.lines)){ pass = false; misses.push(f.path + ' should have ' + f.lines + ' lines'); }
  }
  const o = c.output || {};
  if (o.contains != null && !lastOutput.includes(o.contains)) { pass = false; misses.push('expected output containing "' + o.contains + '"'); }
  if (o.regex != null && !(new RegExp(o.regex, o.flags || '')).test(lastOutput)) { pass = false; misses.push('output doesn\'t match yet'); }
  if (o.equals != null && lastOutput.trim() !== String(o.equals).trim()) { pass = false; misses.push('output not exactly right yet'); }
  const cm = c.cmd || {};
  for (const u of (cm.used || [])) if (!lastCmds.includes(u)){ pass = false; misses.push('use the ' + u + ' command'); }
  if (cm.pipe && !lastPiped){ pass = false; misses.push('use a pipe ( | )'); }
  if (pass) stepPassed();
  else if (verbose){ print('Not yet:', 'warn'); misses.slice(0, 4).forEach(m => print('  · ' + m, 'warn')); }
}
function conceptMatch(spec, given){
  if (!spec) return false;
  const g = given.trim();
  if (spec.accept && spec.accept.some(a => a.toLowerCase() === g.toLowerCase())) return true;
  if (spec.regex && new RegExp(spec.regex, spec.flags || 'i').test(g)) return true;
  if (spec.numeric){
    const v = parseFloat(g.replace(/[^\d.eE+-]/g, ''));
    if (!isNaN(v) && Math.abs(v - spec.numeric.value) <= (spec.numeric.tol || 0)) return true;
  }
  return false;
}

// ---- JS / robot worker sandbox ----
const WORKER_SRC = `
self.onmessage = function(ev){
  const { code, mode, tests, scenario } = ev.data;
  const logs = [];
  const print = (...a) => logs.push(a.map(x => typeof x === 'object' ? JSON.stringify(x) : String(x)).join(' '));
  const console2 = { log: print, error: print, warn: print };
  let robotLog = [], sim = null;
  function makeRobot(sc){
    sim = { t: 0, led: false, ledEvents: [], pos: null, dirIx: 0, printCount: 0,
            motors: { left: 0, right: 0 }, grid: sc.grid || null, sensors: sc.sensors || {}, stream: sc.stream || null, streamIx: 0, samples: [] };
    if (sc.start){ sim.pos = { x: sc.start[0], y: sc.start[1] }; sim.dirIx = sc.dir || 0; } // 0=N 1=E 2=S 3=W
    const DIRS = [[0,-1],[1,0],[0,1],[-1,0]];
    function cellAt(x, y){
      if (!sim.grid) return '.';
      if (y < 0 || y >= sim.grid.length || x < 0 || x >= sim.grid[0].length) return '#';
      return sim.grid[y][x];
    }
    return {
      led: s => { const v = !!s; if (v !== sim.led){ sim.led = v; sim.ledEvents.push({ t: sim.t, on: v }); } },
      motor: (side, power) => { if (side === 'left' || side === 'right') sim.motors[side] = Number(power) || 0; },
      stop: () => { sim.motors.left = 0; sim.motors.right = 0; },
      readSensor: name => {
        if (sim.stream && name === sc.streamSensor) return sim.stream[Math.min(sim.streamIx, sim.stream.length - 1)];
        if (name === 'front' && sim.pos){ const d = DIRS[sim.dirIx]; let dist = 0, x = sim.pos.x, y = sim.pos.y;
          while (dist < 99){ x += d[0]; y += d[1]; if (cellAt(x, y) === '#') break; dist++; } return dist; }
        if (name in sim.sensors) return sim.sensors[name];
        return 0;
      },
      wait: ms => {
        const ticks = Math.max(1, Math.round((Number(ms) || 0) / 100));
        for (let i = 0; i < ticks; i++){
          sim.t += 100;
          if (sim.stream) { sim.streamIx++; sim.samples.push({ t: sim.t, led: sim.led }); }
          const { left, right } = sim.motors;
          if (sim.pos){
            if (left > 0 && right > 0){ const d = DIRS[sim.dirIx]; if (cellAt(sim.pos.x + d[0], sim.pos.y + d[1]) !== '#'){ sim.pos.x += d[0]; sim.pos.y += d[1]; } }
            else if (left > 0 && right <= 0) sim.dirIx = (sim.dirIx + 1) % 4;
            else if (right > 0 && left <= 0) sim.dirIx = (sim.dirIx + 3) % 4;
          }
          robotLog.push({ t: sim.t, pos: sim.pos ? [sim.pos.x, sim.pos.y] : null, led: sim.led });
          if (sim.t > 120000) throw new Error('simulation ran too long');
        }
      },
      print
    };
  }
  try {
    if (mode === 'robot'){
      const robot = makeRobot(scenario);
      const fn = new Function('robot', 'print', '"use strict";' + code);
      fn(robot, print);
      self.postMessage({ ok: true, logs, sim: { t: sim.t, led: sim.led, ledEvents: sim.ledEvents, pos: sim.pos ? [sim.pos.x, sim.pos.y] : null, samples: sim.samples } });
      return;
    }
    // js mode: evaluate, then run tests
    const exports = {};
    const fn = new Function('print', 'console', 'exports', '"use strict";' + code + '\\n;return { ' + (tests || []).filter(t => t.call).map(t => t.call).filter((v, i, a) => a.indexOf(v) === i).map(n => n + ': (typeof ' + n + ' !== "undefined" ? ' + n + ' : undefined)').join(', ') + ' };');
    const fns = fn(print, console2, exports) || {};
    const results = [];
    const deep = (a, b) => JSON.stringify(a) === JSON.stringify(b);
    for (const t of (tests || [])){
      try {
        if (t.call){
          const f = fns[t.call];
          if (typeof f !== 'function'){ results.push({ pass: false, why: 'function ' + t.call + ' not found' }); continue; }
          const got = f.apply(null, JSON.parse(JSON.stringify(t.args || [])));
          results.push({ pass: deep(got, t.want), why: 'got ' + JSON.stringify(got), t });
        } else if (t.outputContains != null){
          results.push({ pass: logs.join('\\n').includes(t.outputContains), why: 'output was: ' + logs.join(' | ').slice(0, 120), t });
        } else if (t.outputLines != null){
          results.push({ pass: deep(logs, t.outputLines), why: 'output was: ' + JSON.stringify(logs).slice(0, 160), t });
        }
      } catch (e){ results.push({ pass: false, why: 'threw: ' + e.message, t }); }
    }
    self.postMessage({ ok: true, logs, results });
  } catch (e){
    self.postMessage({ ok: false, error: e.message, logs });
  }
};`;
let workerURL = null;
function gradeInWorker(code, step, runOnly){
  if (!workerURL) workerURL = URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' }));
  const w = new Worker(workerURL);
  const timer = setTimeout(() => { w.terminate(); eout('⏱ Your code ran too long (infinite loop?). Check your loop conditions.'); }, 3500);
  w.onmessage = ev => {
    clearTimeout(timer); w.terminate();
    const d = ev.data;
    if (!d.ok){ eout('✗ Error: ' + d.error + (d.logs.length ? '\n--- output ---\n' + d.logs.join('\n') : '')); return; }
    if (step.type === 'robot'){
      if (runOnly){ eout('Simulation ran ' + (d.sim.t/1000) + 's.\n' + summarizeSim(d.sim, step) + (d.logs.length ? '\n--- output ---\n' + d.logs.join('\n') : '')); return; }
      const verdict = gradeRobot(d.sim, d.logs, step);
      if (verdict === true){ eout('✔ Scenario complete!'); finishEditorStep(); }
      else eout('✗ ' + verdict + '\n' + summarizeSim(d.sim, step));
      return;
    }
    if (runOnly){ eout((d.logs.length ? '--- output ---\n' + d.logs.join('\n') + '\n' : '') + (d.results ? d.results.map((r, i) => (r.pass ? '✔' : '✗') + ' test ' + (i+1) + (r.pass ? '' : ' — ' + r.why)).join('\n') : 'ran.')); return; }
    const fails = (d.results || []).filter(r => !r.pass);
    if (!d.results || !d.results.length){ eout('No tests defined — submitting anyway.'); finishEditorStep(); return; }
    if (!fails.length){ eout('✔ All ' + d.results.length + ' tests pass!'); finishEditorStep(); }

  };
  w.postMessage({ code, mode: step.type === 'robot' ? 'robot' : 'js', tests: step.tests, scenario: step.scenario });
}
function summarizeSim(sim, step){
  const bits = ['led toggles: ' + sim.ledEvents.length];
  if (sim.pos) bits.push('robot ended at [' + sim.pos + ']' + (step.scenario && step.scenario.goal ? ' (goal [' + step.scenario.goal + '])' : ''));

}
function gradeRobot(sim, logs, step){
  const g = (step.scenario && step.scenario.check) || {};
  if (g.minLedToggles != null && sim.ledEvents.length < g.minLedToggles) return 'the LED needs to change state at least ' + g.minLedToggles + ' times (yours: ' + sim.ledEvents.length + ')';
  if (g.ledPeriodMs != null && sim.ledEvents.length >= 3){
    for (let i = 2; i < sim.ledEvents.length; i++){
      const dt = sim.ledEvents[i].t - sim.ledEvents[i-1].t;
      if (Math.abs(dt - g.ledPeriodMs) > (g.tolMs || 120)) return 'timing is off — each on/off phase should last about ' + g.ledPeriodMs + 'ms';
    }
  }
  if (g.reachGoal){
    const goal = step.scenario.goal;
    if (!sim.pos || sim.pos[0] !== goal[0] || sim.pos[1] !== goal[1]) return 'the robot must end on the goal cell';
  }
  if (g.matchStream){
    // led must track stream > threshold with >=90% accuracy
    const st2 = step.scenario;
    let okc = 0, n = Math.min(sim.samples.length, st2.stream.length);
    if (n < st2.stream.length * 0.8) return 'sample the sensor over the whole stream (loop with readSensor + wait)';
    for (let i = 0; i < n; i++){
      const want = st2.stream[i] > st2.threshold;
      if (sim.samples[i].led === want) okc++;
    }
    if (okc / n < 0.9) return 'the LED must follow the sensor (on when above ' + st2.threshold + ') — accuracy ' + Math.round(okc/n*100) + '%';
  }
  if (g.outputContains != null && !logs.join('\n').includes(g.outputContains)) return 'expected the program to print "' + g.outputContains + '"';
  if (g.outputLines != null && JSON.stringify(logs) !== JSON.stringify(g.outputLines)) return 'printed output isn\'t right yet (' + logs.length + ' lines)';
  return true;
}

      const els = doc.querySelectorAll(a.sel);
      if (a.exists !== false && els.length === 0){ fails.push('missing: ' + a.sel + (a.msg ? ' — ' + a.msg : '')); continue; }
      if (a.exists === false){ if (els.length) fails.push(a.sel + ' should not be there'); continue; }
      if (a.count != null && els.length !== a.count){ fails.push('need exactly ' + a.count + ' of ' + a.sel + ' (found ' + els.length + ')'); continue; }
      const el = els[0];
      if (a.text != null && el.textContent.trim() !== a.text) fails.push(a.sel + ' text should be "' + a.text + '"');
      if (a.textMatch != null && !new RegExp(a.textMatch, 'i').test(el.textContent)) fails.push(a.sel + ' text doesn\'t match yet');
      if (a.attr && el.getAttribute(a.attr.name) !== a.attr.value) fails.push(a.sel + ' needs ' + a.attr.name + '="' + a.attr.value + '"');
      if (a.style){
        const cs = iframe.contentWindow.getComputedStyle(el);
        if (!String(cs[a.style.prop]).split(',')[0].includes(a.style.value)) fails.push(a.sel + ' style ' + a.style.prop + ' should be ' + a.style.value);
      }
    }
    if (!fails.length){ eout('✔ All ' + (step.assertions || []).length + ' checks pass!'); finishEditorStep(); }
    else eout(fails.map(f => '✗ ' + f).join('\n'));
  };

// ---- mini SQL ----
function runSQL(q, tables){
  try {
    q = q.trim().replace(/;$/, '');
    const m = q.match(/^select\s+(.+?)\s+from\s+(\w+)(?:\s+where\s+(.+?))?(?:\s+order\s+by\s+(\w+)(\s+desc)?)?(?:\s+limit\s+(\d+))?$/i);
    if (!m) return { err: 'only SELECT ... FROM ... [WHERE ...] [ORDER BY ...] [LIMIT n] is supported here' };
    const [, colsRaw, tname, whereRaw, orderCol, orderDesc, limitRaw] = m;
    const table = tables[tname];
    if (!table) return { err: 'no table named ' + tname + ' (tables: ' + Object.keys(tables).join(', ') + ')' };
    const cols = table.cols;
    let rows = table.rows.map(r => Object.fromEntries(cols.map((c, i) => [c, r[i]])));
    if (whereRaw){
      const conds = whereRaw.split(/\s+and\s+/i).map(c => {
        const cm = c.match(/^(\w+)\s*(=|!=|>=|<=|>|<|like)\s*(.+)$/i);
        if (!cm) return null;
        let v = cm[3].trim().replace(/^['"]|['"]$/g, '');
        if (!isNaN(parseFloat(v)) && /^[\d.]+$/.test(v)) v = parseFloat(v);
        return { col: cm[1], op: cm[2].toLowerCase(), val: v };
      });
      if (conds.some(c => !c)) return { err: 'could not read the WHERE clause' };
      rows = rows.filter(r => conds.every(c => {
        const a = r[c.col];
        if (a === undefined) return false;
        switch (c.op){
          case '=': return String(a) == String(c.val);
          case '!=': return String(a) != String(c.val);
          case '>': return a > c.val; case '<': return a < c.val;
          case '>=': return a >= c.val; case '<=': return a <= c.val;
          case 'like': return String(a).toLowerCase().includes(String(c.val).replace(/%/g, '').toLowerCase());
        }
      }));
    }
    if (orderCol) rows.sort((x, y) => (x[orderCol] > y[orderCol] ? 1 : x[orderCol] < y[orderCol] ? -1 : 0) * (orderDesc ? -1 : 1));
    if (limitRaw) rows = rows.slice(0, parseInt(limitRaw, 10));
    const wantCols = colsRaw.trim() === '*' ? cols : colsRaw.split(',').map(s => s.trim());
    if (/^count\(\*\)$/i.test(colsRaw.trim())) return { rows: [[rows.length]], cols: ['count'] };
    for (const c of wantCols) if (!cols.includes(c)) return { err: 'no column named ' + c };
    return { rows: rows.map(r => wantCols.map(c => r[c])), cols: wantCols };
  } catch (e){ return { err: e.message }; }
}
function gradeSQL(code, step){
  const r = runSQL(code, step.tables);
  if (r.err){ eout('✗ ' + r.err); return; }
  const want = step.want;
  const norm = rows => (step.ordered ? rows : rows.slice().sort((a, b) => JSON.stringify(a) < JSON.stringify(b) ? -1 : 1));
  if (JSON.stringify(norm(r.rows)) === JSON.stringify(norm(want))){ eout('✔ Query returns exactly the right rows!'); finishEditorStep(); }
  else eout('✗ Not the right rows yet.\nYours (' + r.rows.length + '): ' + JSON.stringify(r.rows.slice(0, 5)) + '\nHint: expected ' + want.length + ' row(s).');
}

let syncedProjects = {};
function syncProjectMastery(projects){
  // Teacher-verified rubric evidence for PROJECT nodes (physical builds) → skill tree.
  // Latest verified rubric per node; mastered = avg >= 3 with no 1s. Student owns its
  // own skill_progress rows, so the sync happens here, exactly like the PE Training Log.
  const latest = {};
  for (const p of (projects || [])){
    if (!p.verified || p.entry_type !== 'rubric') continue;
    if (!latest[p.node_id]) latest[p.node_id] = p;   // list arrives newest-first
  }
  for (const [nodeId, p] of Object.entries(latest)){
    const node = TD.nodes[nodeId];
    const scores = p.detail && Array.isArray(p.detail.scores) ? p.detail.scores : null;
    if (!node || !scores || !scores.length) continue;
    const avg = scores.reduce((a, v) => a + v, 0) / scores.length;
    const mastered = avg >= 3 && !scores.some(s => s <= 1);
    if (!mastered || syncedProjects[nodeId]) continue;
    syncedProjects[nodeId] = true;
    postToHost({ type: 'DOGO_SKILL_PROGRESS', subject: node.legacy_subject || 'Programming',
      skill: node.game_skill || node.title, domain: node.cluster, skillState: 'mastered',
      masteryScore: Math.round(avg / 4 * 100), correct: 0, total: 0, timestamp: new Date().toISOString() });
  }
}

    const line = cmdIn.value;
    cmdIn.value = '';
    if (!line.trim()) return;
    print($('prompt').textContent + ' ' + line, 'echo');
    history.push(line); histIx = history.length;
    try { execLine(line.trim()); } catch (err){ print('shell error: ' + err.message, 'err'); }
    checkStep(false);     // shell steps auto-check after every command
  } else if (e.key === 'ArrowUp'){ if (histIx > 0){ histIx--; cmdIn.value = history[histIx] || ''; } e.preventDefault(); }
  else if (e.key === 'ArrowDown'){ if (histIx < history.length){ histIx++; cmdIn.value = history[histIx] || ''; } e.preventDefault(); }
  else if (e.key === 'Tab'){
    e.preventDefault();
    const parts = cmdIn.value.split(/\s+/);
    const last = parts[parts.length - 1];
    let pool;
    if (parts.length === 1) pool = Object.keys(BIN);
    else {
      const base = last.includes('/') ? last.slice(0, last.lastIndexOf('/') + 1) : '';
      const d2 = nodeAt(base || CWD);
      pool = d2 && d2.type === 'dir' ? Object.keys(d2.children).map(k => base + k) : [];
    }
    const hits = pool.filter(p => p.startsWith(last));
    if (hits.length === 1){ parts[parts.length - 1] = hits[0]; cmdIn.value = parts.join(' '); }
    else if (hits.length > 1) print(hits.join('  '), 'sys');
  } else if (e.key === 'l' && e.ctrlKey){ e.preventDefault(); term.innerHTML = ''; }
});

QUESTS['T-RB054'] = {

QUESTS['T-RB055'] = {
  zone: 'mech-bay', title: 'Reactor Watchdog', xp: 180,

  { title: 'Same job, other machines',
    body: ['macOS: Activity Monitor shows every process and its CPU;',
           'in Terminal, ps, top and kill work as shown here,',
           'and  echo $PATH  prints the environment variable.',
           'Windows: Task Manager (Ctrl+Shift+Esc) lists processes',
           'and End Task terminates one; in PowerShell use',
           'Get-Process, Stop-Process, and  $env:PATH .',
           'List, inspect, terminate, audit — textbook on any OS.'] }
] };

// ── T-SD030 · Advanced Systems Programming (11-12) ─────────────────────
LESSONS['T-SD030'] = { topic: 'Robust Shell Tools', pages: [
  { title: 'The robustness mindset',
    body: ['Amateur scripts assume everything goes right.',
           'Robust tools assume the worst: missing input files,',
           'crashes mid-run, users who pass nonsense.',
           'Every hardened script answers three questions:',
           'What if the input is missing? What if I crash halfway?',
           'How will anyone know what happened?'] },
  { title: 'Functions',
    body: ['A FUNCTION is a reusable, named group of commands:',
           'log() {',
           '  echo "[guard] $1" >> guard.log',
           '}',
           'Call it like a command:  log "started"',
           '$1 inside is the first argument it was called with.',
           'Write the logic once, call it everywhere —',
           'and fix it in one place when it is wrong.'] },
  { title: 'Exit codes: the last word',
    body: ['Every program ends by reporting a number: its exit code.',
           'Zero means all is well. Anything else is a confession.',
           'Your scripts should confess precisely:',
           'exit 0 on success, and a distinct nonzero code',
           'per failure kind (say, exit 2 for missing input).',
           'Callers test the code and react — that is how scripts',
           'invoking scripts stay honest with each other.'],
    example: ['if [ ! -f "$1" ]; then', '  log "missing input $1"', '  exit 2', 'fi'] },
  { title: 'Traps: crash insurance',
    body: ['trap registers commands to run when something happens:',
           'trap "log crashed; rm -r tmpwork" ERR',
           'If any command errors, the trap fires — logging the crash',
           'and cleaning up temp files before the script dies.',
           'The tool never leaves a mess, even when it fails.',
           'That is the difference between a script and a TOOL.'] },
  { title: 'Process substitution',
    body: ['Some commands only accept FILES, not pipes.',
           'Process substitution fakes one:  <(command)',
           'lets a program read another command\'s live output',
           'as if it were a file on disk.',
           'diff <(sort a.txt) <(sort b.txt)',
           'compares two sorted streams — no temp files needed.'] },
  { title: 'Robustness on other machines',
    body: ['These patterns run unchanged in Mac Terminal —',
           'zsh and bash both support functions, traps and exit codes.',
           'PowerShell expresses the same discipline its own way:',
           'function blocks, try/catch for traps,',
           'and $LASTEXITCODE to read the previous exit code.',
           'The mindset — assume the worst, log everything — is portable.'] }
] };

// ── T-SD031 · Systems and Application Automation (11-12) ───────────────
LESSONS['T-SD031'] = { topic: 'Scheduled, Logged, Recoverable', pages: [
  { title: 'Reading a cron schedule',
    body: ['cron runs commands on a clock, human or no human.',
           'A crontab line has five time fields, then the command:',
           'minute  hour  day-of-month  month  day-of-week',
           '0 2 * * *  sh digest.sh night1',
           'means: at minute 0 of hour 2 — 02:00 — every day,',
           'run digest.sh with the argument night1.',
           'Stars mean "every". Learn to read the five fields.'],
    example: ['# m h dom mon dow  command', '0 2 * * *  sh digest.sh night1'] },
  { title: 'Parameterized scripts',
    body: ['One script, many jobs: pass a PARAMETER.',
           'sh digest.sh night1   and   sh digest.sh night2',
           'run the same logic against different inputs — inside',
           'the script, $1 holds that argument.',
           'A parameterized suite scales without copy-paste:',
           'new night, new argument, zero new code.'] },
  { title: 'Every run leaves a record',
    body: ['Scheduled jobs run while everyone sleeps,',
           'so every run must append to a log:',
           'echo night1 done >> watch.log',
           'Success gets logged. Failure gets logged HARDER.',
           'The morning check is one command: cat watch.log —',
           'and the whole night is accounted for.'] },
  { title: 'Failure recovery lanes',
    body: ['Design the bad-input lane before you need it:',
           '1) Detect — corrupt data has signatures; peek inside.',
           '2) Quarantine — mv the bad file aside; never process it,',
           '   never delete it (it is evidence).',
           '3) Recover — rebuild from a backup source instead.',
           '4) Log the recovery, so morning-you knows it happened.',
           'The pipeline still delivers, corruption and all.'],
    example: ['$ mv night2.raw quarantine', '$ grep beacon night2.bak | sort | uniq > night2.digest'] },
  { title: 'Rollups and other schedulers',
    body: ['Nightly outputs merge into weekly reports the usual way:',
           'cat night1.digest night2.digest | sort | uniq > week.report',
           'Where the clock lives depends on the OS:',
           'cron on Unix and macOS (plus launchd on Macs),',
           'Task Scheduler on Windows.',
           'Any of them can fire a script that logs and recovers —',
           'the discipline is yours to write, on every platform.'] }
] };
// GRIDFALL Systems & Platform Codex — Part 2: web-module lessons (9 nodes)

// ── T-SD008 · Markup Languages (6-8) ───────────────────────────────────
LESSONS['T-SD008'] = { topic: 'Tags, Nesting, Attributes', pages: [
  { title: 'Tags make elements',
    body: ['HTML is a language of TAGS in angle brackets.',
           'Most come in pairs: an opening tag and a closing tag',
           'with a slash. Together with their content they form',
           'an ELEMENT:',
           '<p>The ledgers survived.</p>',
           'A few tags stand alone and never close, like <img>.'],
    example: ['<h1>Harbor Registry</h1>', '<p>All ships accounted for.</p>'] },
  { title: 'Nesting: boxes in boxes',
    body: ['Elements sit INSIDE other elements — that is nesting.',
           'The rule: close the inner element before the outer one.',
           'Right:  <p>The <b>brave</b> crew</p>',
           'Wrong:  <p>The <b>brave</p></b>',
           'Broken nesting is "tag soup" — browsers guess, badly.',
           'Well-formed markup nests cleanly, every tag closed.'] },
  { title: 'Attributes: settings inside tags',
    body: ['An ATTRIBUTE is a name="value" pair inside an opening tag.',
           '<img src="dock.png" alt="cargo crate">',
           'src tells the browser WHICH image file to fetch.',
           'alt is the text description — read aloud by screen',
           'readers, and shown if the image cannot load.',
           'Links use one too: <a href="map.html"> points somewhere.'] },
  { title: 'Structure vs presentation',
    body: ['HTML gives a page its STRUCTURE: what things ARE —',
           'headings, paragraphs, lists, images.',
           'CSS (Cascading Style Sheets) controls how it LOOKS:',
           'colors, fonts, spacing.',
           'Keep them separate: structure in HTML, style in CSS.',
           'Same structure, new stylesheet = whole new look.'] },
  { title: 'Read any page\'s source',
    body: ['Every web page ships its HTML to your browser — look!',
           'In Chrome or Edge: right-click the page, View Page Source',
           '(Ctrl+U on Windows, Cmd+Option+U on a Mac).',
           'In Safari on a Mac: enable the Develop menu in Settings,',
           'then Show Page Source (Cmd+Option+U).',
           'Real sites are open textbooks — go read a few.'] }
] };

// ── T22 · Web Foundations (6-8) ────────────────────────────────────────
LESSONS['T22'] = { topic: 'Your First Real Page', pages: [
  { title: 'Headings and paragraphs',
    body: ['<h1> is the page\'s main headline — use it once.',
           '<h2> down to <h6> are smaller sub-headings.',
           '<p> wraps each paragraph of normal text.',
           'Browsers add spacing between them automatically.'],
    example: ['<h1>Signal Restored</h1>', '<p>The beacon is back online.</p>'] },
  { title: 'Lists',
    body: ['<ul> starts a bulleted (Unordered) List.',
           '<ol> starts a numbered (Ordered) one.',
           'Each item inside is an <li> — List Item.',
           'Close every li, then close the list itself.'],
    example: ['<ul>', '  <li>rope</li>', '  <li>lamp oil</li>', '</ul>'] },
  { title: 'Images and alt text',
    body: ['<img src="beacon.png" alt="lighthouse">',
           'src names the image file to show.',
           'alt DESCRIBES the image in words. It matters:',
           'screen readers speak it to blind visitors,',
           'and it appears whenever the image fails to load.',
           'Every image deserves honest alt text.'] },
  { title: 'Links',
    body: ['<a href="https://rivertech.me">Return to port</a>',
           'The a tag makes a link. href holds the destination;',
           'the text between the tags is what visitors click.',
           'Links can point to whole sites or to nearby files',
           'like  href="manifest.html".'] },
  { title: 'A first taste of CSS',
    body: ['CSS styles your structure. A rule looks like:',
           'p { color: teal; }',
           'selector { property: value; }',
           'color changes text color; font-family changes the font.',
           'Add class="intro" to an element and target it with .intro',
           'to style just that one kind of paragraph.'],
    example: ['<style>', '  .intro { color: teal; }', '</style>'] },
  { title: 'Learn from real pages',
    body: ['Every site you visit is built from these same pieces.',
           'View the source in Chrome, Edge or Safari —',
           'right-click, View Page Source (Ctrl+U on Windows,',
           'Cmd+Option+U on a Mac) — and find the h1, the lists,',
           'the links. The whole web is your example file.'] }
] };

// ── T-SD018 · Web to Desktop Design (9-10) ─────────────────────────────
LESSONS['T-SD018'] = { topic: 'Containers and Flexbox', pages: [
  { title: 'Layouts are containers',
    body: ['Desktop-feeling apps are built from CONTAINERS:',
           'a toolbar strip on top, work panels in the middle,',
           'a status bar at the foot.',
           'In HTML each container is usually a <div> —',
           'a plain box that exists to hold and arrange things.',
           'Sketch the boxes first; the markup writes itself.'],
    example: ['<div id="toolbar">Tools</div>',
              '<div class="panel">Map</div>',
              '<div id="statusbar">Ready</div>'] },
  { title: 'id vs class',
    body: ['An id names ONE unique element: id="toolbar".',
           'Only one element per page may carry a given id.',
           'A class marks a KIND of element: class="panel" —',
           'many panels can share it.',
           'CSS targets them as #toolbar and .panel',
           'One-of-a-kind gets an id; repeatables get a class.'] },
  { title: 'display: flex',
    body: ['Flexbox is CSS\'s flexible row-and-column engine.',
           'Set it on the PARENT container:',
           '.workspace { display: flex; }',
           'Its children now line up in a neat row.',
           'flex-direction: column stacks them vertically instead.',
           'Panels grow, shrink and align without fragile math.'],
    example: ['.workspace { display: flex; }',
              '.panel { flex: 1; }   /* share space equally */'] },
  { title: 'Sizing with intent',
    body: ['Equal columns are arithmetic: a 900px-wide window',
           'holding three equal columns gives each one 300px.',
           'But fixed pixels are brittle — prefer flexible shares:',
           'flex: 1 on each panel divides space evenly',
           'at ANY window size. Spacing comes from gap and padding,',
           'not from guessed margins.'] },
  { title: 'Consistent hierarchy',
    body: ['Users learn a layout once and expect it everywhere:',
           'toolbar always up top, status always at the foot,',
           'panels between — every screen of your app the same.',
           'Reuse the same class names (.panel) for the same roles',
           'so one stylesheet rules them all.',
           'Consistency is what makes a page FEEL like an app.'] }
] };

// ── T-SD019 · HTML CSS (9-10) ──────────────────────────────────────────
LESSONS['T-SD019'] = { topic: 'Skeleton First, Style Second', pages: [
  { title: 'Bones before paint',
    body: ['Build in two passes, always in this order:',
           '1. STRUCTURE — headings, paragraphs, links, in clean HTML.',
           '2. STYLE — colors, fonts, spacing, in CSS.',
           'A page with good bones is readable even unstyled.',
           'A styled page with broken bones is a haunted house.'],
    example: ['<h1>Quartermaster Log</h1>',
              '<p class="note">Ropes counted.</p>',
              '<a href="manifest.html">full manifest</a>'] },
  { title: 'Selectors: who gets styled',
    body: ['A CSS rule starts with a SELECTOR — who it applies to:',
           'p          every paragraph element',
           '.note      every element with class="note"',
           '#header    the one element with id="header"',
           'Then the declarations: { property: value; }',
           'p { color: teal; }  paints every paragraph teal.'] },
  { title: 'The style element',
    body: ['CSS can live in a <style> block on the page:',
           '<style>',
           '  h1 { font-family: monospace; }',
           '  p  { color: teal; }',
           '<' + '/style>',
           'Each rule on its own line, each declaration ending in ;',
           'Bigger sites move this into a separate .css file.'] },
  { title: 'The box model',
    body: ['Every element is a box with layers, inside out:',
           'CONTENT — the text or image itself',
           'PADDING — breathing room inside the border',
           'BORDER  — the drawn edge',
           'MARGIN  — space pushing neighbors away',
           'Total width = content + left/right padding + borders.',
           'Example: 200px content + 10px padding each side',
           '+ 5px border each side = 200 + 20 + 10 = 230px.'] },
  { title: 'Typography and color',
    body: ['font-family sets the typeface; give fallbacks:',
           'font-family: Georgia, serif;',
           'color sets text color; background-color fills the box.',
           'Keep contrast high — dark text on light, or the reverse.',
           'A page must be readable by lamplight. Style serves',
           'reading; it never fights it.'] }
] };

// ── T-SD022 · HTML CSS Concepts (9-10) ─────────────────────────────────
LESSONS['T-SD022'] = { topic: 'Cascade, Specificity, Inheritance', pages: [
  { title: 'When rules collide',
    body: ['Two rules walk into one element. Only one walks out.',
           'The CASCADE is CSS\'s system for deciding which:',
           'more specific selectors beat less specific ones,',
           'and among equals, the LAST rule in the file wins.',
           'Learn the tiebreakers and the stylesheet stops',
           'fighting you.'] },
  { title: 'Specificity ranks',
    body: ['From weakest to strongest:',
           'tag selectors      p        weakest',
           'class selectors    .note    beat tags',
           'id selectors       #alert   beat classes',
           'So if .critical says blue and #alert says red,',
           'the element renders red — the id outranks the class.',
           'One element can carry an id AND classes at once:',
           '<p id="alert" class="critical">...</p>'] },
  { title: 'Inheritance',
    body: ['Text properties flow DOWN the tree to children.',
           'If body { color: green; } and a paragraph inside',
           'sets no color of its own, its text renders green —',
           'it INHERITS from its parent.',
           'Color and font properties inherit; box properties',
           '(padding, border, margin) do not.',
           'Set text defaults once on body; override where needed.'] },
  { title: 'Box model arithmetic',
    body: ['Rendered width adds up layer by layer:',
           'content + padding (both sides) + border (both sides).',
           '150px content, 12px padding each side, 3px border',
           'each side: 150 + 24 + 6 = 180px.',
           'Do this math whenever boxes overflow mysteriously —',
           'the extra width is almost always padding and border.'] },
  { title: 'See the cascade live',
    body: ['Browser DevTools show exactly which rule won and why.',
           'Open them with F12 (Windows) or Cmd+Option+I (Mac)',
           'in Chrome, Edge or Safari, then inspect any element:',
           'winning rules on top, defeated ones struck through.',
           'It is the cascade, visualized — the fastest way',
           'to debug a style that will not apply.'] }
] };

// ── T-SD023 · Basic HTML Design (9-10) ─────────────────────────────────
LESSONS['T-SD023'] = { topic: 'Semantic Layout Bones', pages: [
  { title: 'The trouble with div soup',
    body: ['You CAN build a whole page from anonymous divs.',
           'But screen readers, search engines and other developers',
           'get lost in it — every box looks the same.',
           'Semantic tags fix that: each region gets a tag',
           'that says what the region IS.'] },
  { title: 'The four big bones',
    body: ['<header>  the page\'s masthead: title, logo, banner',
           '<nav>     the main block of navigation links',
           '<main>    the primary content — one per page',
           '<footer>  the foot: credits, copyright, small print',
           'Lay these four down first, even empty.',
           'The skeleton comes before the flesh.'],
    example: ['<header></header>', '<nav></nav>',
              '<main></main>', '<footer></footer>'] },
  { title: 'Flesh on the bones',
    body: ['Inside the skeleton, the usual parts take their places:',
           'the h1 headline near the top, links inside the nav,',
           'content in main, a copyright line in the footer.',
           'Repeated things share a class — three nav links',
           'can all carry class="navlink" so one CSS rule',
           'styles them identically.'],
    example: ['<nav>', '  <a class="navlink" href="#">Berths</a>',
              '  <a class="navlink" href="#">Cargo</a>', '</nav>'] },
  { title: 'Semantics means meaning',
    body: ['Semantic tags mostly do not change how things LOOK —',
           'they add MEANING for machines.',
           'A screen reader can jump straight to <nav> or <main>.',
           'Search engines weigh content by the region it sits in.',
           'Style is for eyes; semantics is for everyone else.',
           'Build with real bones and every reader finds their way.'] }
] };

// ── T-SD024 · HTML to Web Fundamentals (9-10) ──────────────────────────
LESSONS['T-SD024'] = { topic: 'From Request to Render', pages: [
  { title: 'The request',
    body: ['Every page starts as a REQUEST across the network.',
           'The protocol carrying it is HTTP — or HTTPS,',
           'the secure kind — the letters at the front of a URL.',
           'Your browser asks a server for index.html;',
           'the server answers with the file; only then',
           'can anything render. Request, response, render.'] },
  { title: 'The head steers the page',
    body: ['The document head holds instructions, not content:',
           '<meta charset="utf-8">  how to decode the characters —',
           'without it, quotes and accents turn to garbage.',
           '<title>Dock Manifest</title>  names the browser tab.',
           '<link rel="stylesheet" href="styles.css">  pulls in',
           'the CSS file before the body paints.',
           'Head elements first — they steer everything after.'],
    example: ['<meta charset="utf-8">', '<title>Dock Manifest</title>',
              '<link rel="stylesheet" href="styles.css">'] },
  { title: 'Scripts: async vs defer',
    body: ['A plain script tag PAUSES page parsing while it runs.',
           'Two attributes avoid the stall:',
           'async — download in parallel, run the moment it arrives',
           '(order not guaranteed).',
           'defer — download in parallel, but politely postpone',
           'running until the document is fully parsed, in order.',
           'For scripts that touch the page\'s elements, defer wins.'] },
  { title: 'Parse, build, paint',
    body: ['Once the HTML arrives, the browser parses it top to',
           'bottom, builds its model of the document, fetches the',
           'CSS and images it references, then paints pixels.',
           'That is why order matters: stylesheets in the head,',
           'deferred scripts, images with sizes.',
           'A well-ordered page paints fast and never jumps around.'] },
  { title: 'Watch the journey yourself',
    body: ['Browsers let you see all of it happen.',
           'View Page Source (Ctrl+U Windows, Cmd+Option+U Mac)',
           'shows the raw HTML the server sent.',
           'DevTools (F12 or Cmd+Option+I) has a Network tab:',
           'reload and watch the HTML arrive first, then CSS,',
           'images and scripts — the whole request parade,',
           'in Chrome, Edge or Safari, on Mac or Windows alike.'] }
] };

// ── T-SD025 · Building Responsive Websites (9-10) ──────────────────────
LESSONS['T-SD025'] = { topic: 'One Page, Every Screen', pages: [
  { title: 'The responsive promise',
    body: ['Your page will be read on wall screens, laptops,',
           'tablets and cracked phones — the same page.',
           'Responsive design means it REFLOWS to fit each one:',
           'no tiny unreadable text, and above all,',
           'no horizontal scrolling. Ever.'] },
  { title: 'The viewport meta tag',
    body: ['Phones pretend to be desktops unless you say otherwise.',
           'This head line makes them report their true width:',
           '<meta name="viewport"',
           '      content="width=device-width, initial-scale=1">',
           'Without it, every other responsive technique fails —',
           'the phone just shows a shrunken desktop page.'],
    example: ['<meta name="viewport" content="width=device-width, initial-scale=1">'] },
  { title: 'Fluid units',
    body: ['Fixed units freeze: 300px is 300px on every screen.',
           'Fluid units flex: 50% is half of WHATEVER holds it.',
           'Prefer percentages and flexible boxes for layout,',
           'and cap media with:',
           'img { max-width: 100%; }',
           'so images shrink with their container instead of',
           'punching through the side of a phone screen.'] },
  { title: 'Breakpoints with @media',
    body: ['The @media at-rule applies styles conditionally:',
           '@media (max-width: 600px) {',
           '  .deck { width: 100%; }',
           '}',
           'These rules fire only when the screen is 600px or',
           'narrower — a BREAKPOINT where the layout changes.',
           'The classic move: multi-column cards on wide screens',
           'stack into a single column on narrow phones.'] },
  { title: 'Test at every width',
    body: ['Responsive claims must be tested, not trusted.',
           'Easiest check: drag your browser window narrower',
           'and watch the layout reflow — Mac or Windows.',
           'Better: DevTools device mode (F12 / Cmd+Option+I,',
           'then the phone icon) simulates real phone and tablet',
           'sizes in Chrome, Edge and Safari.',
           'Phone, tablet, desktop: all three, before you ship.'] }
] };

// ── T-SD039 · Front-End Development (11-12) ────────────────────────────
LESSONS['T-SD039'] = { topic: 'Building an Interface to Spec', pages: [
  { title: 'Read the spec like a contract',
    body: ['Front-end work usually starts from a design SPEC:',
           'exact headings, exact counts, exact names.',
           'Treat it as a contract — "three cards" means exactly',
           'three, and the h1 wording matters to the letter.',
           'Professionals are measured on fidelity to spec first,',
           'cleverness second.'] },
  { title: 'Classes repeat, ids do not',
    body: ['The spec says a status pill appears on MANY elements:',
           'that is a CLASS — class="status-pill" — reusable freely.',
           'The spec says ONE version label exists: that is an id —',
           'id="version" — unique on the page.',
           'Choosing wrong bites later: duplicate ids break',
           'scripts and CSS in quiet, maddening ways.'] },
  { title: 'The shell: semantic frame',
    body: ['Every console-style interface begins with the frame:',
           'header for the masthead, nav holding the route links,',
           'main for the working area, footer for the small print.',
           'Give the nav links a shared class so they style as one.'],
    example: ['<header><h1>Harbormaster Console</h1></header>',
              '<nav>', '  <a class="navlink" href="#">Berths</a>',
              '  <a class="navlink" href="#">Tides</a>', '</nav>'] },
  { title: 'Components: cards and pills',
    body: ['Interfaces are assembled from repeatable COMPONENTS.',
           'A card: a div with class="card" holding one widget\'s',
           'title, content and status.',
           'A status pill: a small span with class="status-pill"',
           'showing OK / DOWN at a glance.',
           'Build one well, stamp out as many as the spec asks.'],
    example: ['<div class="card">Berths', '  <span class="status-pill">OK</span>',
              '</div>'] },
  { title: 'Layout with flex',
    body: ['Arrange the components with flexbox on their parent:',
           'main { display: flex; }',
           'The cards line up in a row and share the space.',
           'Add gap for spacing and flex-wrap so cards flow',
           'to the next line on narrow screens.',
           'Structure, components, layout — then compare against',
           'the spec one requirement at a time.'],
    example: ['<style>', '  main { display: flex; gap: 12px; }', '<' + '/style>'] },
  { title: 'Making it react',
    body: ['Static interfaces become apps through EVENTS.',
           'querySelector finds an element;',
           'addEventListener attaches behavior to it:',
           'btn.addEventListener("click", refresh);',
           'Finding is not listening — you need both, in that order.',
           'That is the doorway into interactive front-end work.'] }
] };

// ── T1 · Device Basics (K-2) ───────────────────────────────────────────
LESSONS['T1'] = { topic: 'Wake Up Your Device', pages: [
  { title: 'On and off',
    body: ['Every device has a power button.',
           'Press it to turn the device ON.',
           'It has a circle-with-a-line mark on it.',
           'Use the same button to turn it off, the safe way.',
           'Never just unplug a device that is on!'] },
  { title: 'Your secret word',
    body: ['A password is a secret word that lets you in.',
           'Only YOU should know your password.',
           'Do not tell it to friends. Not even best friends!',
           'Type it in, and the device says: welcome!'] },
  { title: 'Name the parts',
    body: ['The SCREEN is the flat, glowing part. It shows',
           'pictures and words. You look at it.',
           'The KEYBOARD has letter keys: A, B, C...',
           'and a long space bar. You type with it.',
           'A MOUSE or TRACKPAD moves the little pointer.',
           'The CHARGING PORT is the small slot on the side.',
           'The charger cord clicks in there to fill the battery.'] },
  { title: 'Open and close apps',
    body: ['Apps are the programs you use — games, drawing, books.',

           'Same idea, two names!'] }
] };

// ── T3 · Keyboarding & Input (K-2) ─────────────────────────────────────
LESSONS['T3'] = { topic: 'Happy Typing Fingers', pages: [
  { title: 'Look, then type',

  { title: 'Dots and marks',
    body: ['A period . ends a sentence. It is one small dot.',

] };

// ── T4 · Digital Citizenship (K-2) ─────────────────────────────────────
LESSONS['T4'] = { topic: 'Stay Safe on the Grid', pages: [

// ── T7 · Internet Research (3-5) ───────────────────────────────────────
LESSONS['T7'] = { topic: 'Search Like a Detective', pages: [
  { title: 'Ask a sharp question',
    body: ['Search engines match the words you give them.',
           'One vague word gets a million fuzzy answers.',
           'Use the exact thing you want to know:',
           'not  dogs  but  how fast can a greyhound run',

// ── T8 · Digital Communication (3-5) ───────────────────────────────────
LESSONS['T8'] = { topic: 'Send the Right Message', pages: [
  { title: 'The subject line',
    body: ['Every email starts with a SUBJECT — one short line',

           'Readers see it before they even open the mail.',

           'Bad: hi  (about what?)',
           'Clear subject, happy reader.'] },
  { title: 'Match your tone to your reader',

           'To a friend: relaxed is fine!',
           'Ask: WHO will read this? Then write for them.'] },
  { title: 'Reply vs reply-all',
